# Everything under services: is called a container.
# Architecture Overview:
#
# Client / Browser (Port 80)
#       │
#       ▼
# [ nginx ] (Reverse Proxy & Static File Server)
#       │
#       ├── Serves /static/ & /media/ directly from shared volumes
#       └── Proxies dynamic API & WebSocket traffic to Daphne (Port 8000)
#               │
#               ▼
#        [ web ] (Django ASGI Daphne App)
#               │
#               ├── [ db ] (PostgreSQL 17)
#               ├── [ redis ] (Redis 7 Message Broker & Cache)
#               ├── [ celery_worker ] (Background Task Execution)
#               └── [ celery_beat ] (Task Scheduler)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apihub_db}
      POSTGRES_USER: ${POSTGRES_USER:-apihub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apihub_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apihub_user} -d ${POSTGRES_DB:-apihub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django Web Application Container running Daphne ASGI Server
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    # Internal communication only: Expose port 8000 to other containers on the Docker network.
    # Port 8000 is NOT published to the host system directly (Nginx acts as the sole entry point).
    # Port 8000 is only for internal communication between Nginx and the Django app.
    expose:
      - "8000"
    env_file:
      - .env.docker
    environment:
      - RUN_MIGRATIONS=true
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Reverse Proxy Container
  # Acts as the public entrypoint on host port 80. Serves static & media files directly
  # and proxies dynamic/WebSocket requests to the internal 'web' container on port 8000.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - .env.docker
    environment:
      - RUN_MIGRATIONS=false
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - .env.docker
    environment:
      - RUN_MIGRATIONS=false
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
