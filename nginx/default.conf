# Nginx configuration for APIHub Reverse Proxy

# Map for WebSocket connection upgrade handling.
# If the incoming request has an 'Upgrade' header (e.g. WebSocket connection),
# set $connection_upgrade to 'upgrade', otherwise set it to 'close'.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # '_' acts as a catch-all server_name for any hostname/IP (localhost, 127.0.0.1, LAN IP, domain)
    server_name _;

    # Client body size limit for file uploads (e.g., media files)
    client_max_body_size 20M;

    # -------------------------------------------------------------------------
    # 1. Serve Static Files Directly
    # -------------------------------------------------------------------------
    # Why it exists: Serves pre-collected static assets (CSS, JS, images) directly from disk.
    # Docker networking: Reads directly from shared 'static_volume' mounted at /app/staticfiles/.
    # Django bypassed: Request never reaches Daphne or Django, drastically improving performance.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # -------------------------------------------------------------------------
    # 2. Serve Media Files Directly
    # -------------------------------------------------------------------------
    # Why it exists: Serves user-uploaded media files directly from disk.
    # Docker networking: Reads directly from shared 'media_volume' mounted at /app/media/.
    # Django bypassed: Bypasses Python execution for static file serving.
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # -------------------------------------------------------------------------
    # 3. Reverse Proxy for Application Traffic (HTTP & WebSockets)
    # -------------------------------------------------------------------------
    # Why it exists: Forwards all dynamic API, admin, and WebSocket requests to Daphne.
    # Docker networking: 'http://web:8000' uses Docker's internal DNS to route requests to the
    #                    'web' container on port 8000 within the private bridge network.
    location / {
        proxy_pass http://web:8000;

        # Disable redirect rewriting & response buffering for streaming & WebSockets
        proxy_redirect off;
        proxy_buffering off;

        # Preserve client headers so Django sees original request metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 and Upgrade headers required for WebSocket proxying (Django Channels)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts for long-lived WebSocket connections (86400s = 24 hours)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
