name: CI Pipeline

on:
  push:
    branches: [ main, master, shruti ]
  pull_request:
    branches: [ main, master, shruti ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: apihub_db
          POSTGRES_USER: apihub_user
          POSTGRES_PASSWORD: apihub_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Test Suite (120 Tests)
        env:
          SECRET_KEY: ci-testing-secret-key-apihub-1234567890
          DEBUG: True
          DB_NAME: apihub_db
          DB_USER: apihub_user
          DB_PASSWORD: apihub_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          python manage.py test
